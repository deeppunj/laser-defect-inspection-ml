# pyproject.toml
# I describe my project here, so pip can install it and Python can import it
# from anywhere as "laser_defect".

[build-system]
# I tell pip to build my package with setuptools.
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# This is the name I import in Python: import laser_defect
name = "laser_defect"
version = "0.5.0"
description = "Detecting weld discontinuities in laser beam welding from thermal (LWIR) camera frames"
requires-python = ">=3.10"
# I add libraries phase by phase, so I always know why each one is here.
dependencies = [
    "requests>=2.31",   # I use requests to download the dataset
    "pandas>=2.0",      # I use pandas to read the label tables
    "pytest>=7.0",      # I use pytest to test my code
    "numpy>=1.24",      # phase 1: I store thermal frames as numerical arrays
    "pillow>=10.0",     # phase 1: I use Pillow to open the .tiff thermal images
    "matplotlib>=3.7",  # phase 2: I draw plots with matplotlib
    "ipykernel>=6.0",   # phase 2: lets VS Code run my Jupyter notebook in this environment
    "nbclient>=0.9",    # phase 2: lets my tests run the whole notebook automatically
    "nbformat>=5.9",    # phase 2: reads and writes .ipynb notebook files
    "scikit-learn>=1.3", # phase 4: machine learning models and evaluation
]

[tool.setuptools.packages.find]
# I tell setuptools that my Python code lives in the src/ folder.
where = ["src"]

[tool.pytest.ini_options]
# I tell pytest to look for tests in the tests/ folder.
testpaths = ["tests"]
