# Phase 7: GitHub runs my tests automatically on every push.
# Tests that need the real dataset are skipped there (it is not stored in git).
name: tests
on: [push, pull_request]
# This file lives in the repository root (.github/workflows/), so GitHub finds it.
# The project is the repository root, so every step runs there.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: pytest -q
